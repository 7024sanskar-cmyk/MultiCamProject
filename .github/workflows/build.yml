name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Xcode Project and Build App
        run: |
          # Generate Xcode project from Package.swift
          swift package generate-xcodeproj

          # Build .app using xcodebuild
          xcodebuild build \
            -project MultiCamApp.xcodeproj \
            -scheme MultiCamApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Copy the compiled .app bundle
          cp -R build/Release-iphoneos/MultiCamApp.app Payload/
          
          # Ensure Info.plist is present in the app bundle
          cp Info.plist Payload/MultiCamApp.app/Info.plist
          
          # Create PkgInfo
          echo -n "APPL????" > Payload/MultiCamApp.app/PkgInfo

          # Ad-hoc sign the entire bundle structure
          codesign --force --deep --sign - Payload/MultiCamApp.app
          
          # Create standard IPA archive
          zip -r -y MultiCamApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCamApp-IPA
          path: MultiCamApp.ipa