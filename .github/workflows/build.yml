name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Native iOS App
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # 1. Compile Swift sources directly targeting arm64 iOS
          mkdir -p Payload/MultiCamApp.app
          
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -emit-executable \
            Sources/MultiCamApp/*.swift \
            -o Payload/MultiCamApp.app/MultiCamApp

          # 2. Add Info.plist and runtime metadata
          cp Info.plist Payload/MultiCamApp.app/Info.plist
          echo -n "APPL????" > Payload/MultiCamApp.app/PkgInfo

          # 3. Embed required Swift standard libraries for device compatibility
          mkdir -p Payload/MultiCamApp.app/Frameworks
          SWIFT_LIB_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          if [ -d "$SWIFT_LIB_DIR" ]; then
            cp "$SWIFT_LIB_DIR"/*.dylib Payload/MultiCamApp.app/Frameworks/ 2>/dev/null || true
          fi

          # 4. Sign with ad-hoc signature so Sideloadly can replace it cleanly
          codesign --force --deep --sign - Payload/MultiCamApp.app

          # 5. Archive to IPA
          zip -r -y MultiCamApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCamApp-IPA
          path: MultiCamApp.ipa