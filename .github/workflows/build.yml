name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -project MultiCamApp.xcodeproj \
            -scheme MultiCamApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/MultiCamApp.app Payload/
          zip -r -y MultiCamApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCamApp-IPA
          path: MultiCamApp.ipa