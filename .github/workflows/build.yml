name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Native iOS App
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/MultiCamApp.app build_obj

          cat << 'EOF' > build_obj/ObjCExceptionCatcher.h
          #import <Foundation/Foundation.h>
          NS_ASSUME_NONNULL_BEGIN
          @interface ObjCExceptionCatcher : NSObject
          + (BOOL)tryExecute:(void(NS_NOESCAPE ^)(void))tryBlock error:(NSError * _Nullable * _Nullable)error __attribute__((swift_error(none)));
          @end
          NS_ASSUME_NONNULL_END
          EOF

          cat << 'EOF' > build_obj/ObjCExceptionCatcher.m
          #import "ObjCExceptionCatcher.h"
          @implementation ObjCExceptionCatcher
          + (BOOL)tryExecute:(void(NS_NOESCAPE ^)(void))tryBlock error:(NSError * _Nullable * _Nullable)error {
              @try {
                  tryBlock();
                  return YES;
              }
              @catch (NSException *exception) {
                  if (error) {
                      NSDictionary *userInfo = @{
                          NSLocalizedDescriptionKey: [NSString stringWithFormat:@"%@: %@", exception.name, exception.reason ?: @"Unknown reason"]
                      };
                      *error = [NSError errorWithDomain:@"com.local.multicam.exception" code:-1 userInfo:userInfo];
                  }
                  return NO;
              }
          }
          @end
          EOF

          xcrun -sdk iphoneos clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            -c build_obj/ObjCExceptionCatcher.m \
            -o build_obj/ObjCExceptionCatcher.o

          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -import-objc-header build_obj/ObjCExceptionCatcher.h \
            Sources/MultiCamApp/*.swift \
            build_obj/ObjCExceptionCatcher.o \
            -o Payload/MultiCamApp.app/MultiCamApp

          cp Info.plist Payload/MultiCamApp.app/Info.plist
          echo -n "APPL????" > Payload/MultiCamApp.app/PkgInfo

          codesign --force --deep --sign - Payload/MultiCamApp.app

          zip -r -y MultiCamApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCamApp-IPA
          path: MultiCamApp.ipa